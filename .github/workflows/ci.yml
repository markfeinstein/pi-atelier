name: CI

on:
  pull_request:
    branches:
      - integration
  push:
    branches:
      - integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin integration
            git diff --check origin/integration...HEAD
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}".."${{ github.sha }}"
          else
            git diff --check
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

      - name: Verify package dry run
        run: npm pack --dry-run --json > pack-report.json

      - name: Upload package dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-dry-run
          path: pack-report.json
